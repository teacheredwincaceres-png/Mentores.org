<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guía MentorIA SOL — MENTORES by GuateStar</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --c0:#04081a; --c1:#00d4ff; --c2:#7c3aed; --c3:#f5a623;
  --c4:#1a0533; --white:#e8f0fe; --muted:#6b7fa3;
}
html{scroll-behavior:smooth}
body{font-family:'Space Grotesk',sans-serif;background:var(--c0);color:var(--white);overflow-x:hidden;cursor:none}
a,button{cursor:none}

/* CURSOR */
#cd{position:fixed;width:8px;height:8px;border-radius:50%;background:var(--c1);pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width .2s,height .2s,background .2s;mix-blend-mode:screen}
#cr{position:fixed;width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(0,212,255,0.5);pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:transform .12s ease,width .3s,height .3s,border-color .3s}
body.hovering #cd{width:16px;height:16px;background:var(--c3)}
body.hovering #cr{width:56px;height:56px;border-color:rgba(245,166,35,0.5)}

/* BG */
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
#section-color{position:fixed;inset:0;z-index:1;pointer-events:none;transition:background 1.2s ease}

/* PROGRESS */
#prog{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3));z-index:200;width:0%;transition:width .1s linear;box-shadow:0 0 10px var(--c1)}

/* HEADER */
.hdr{position:fixed;top:0;left:0;right:0;z-index:150;padding:18px 48px;display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(20px);background:rgba(4,8,26,0.7);border-bottom:1px solid rgba(255,255,255,0.05)}
.hdr-logo{display:flex;align-items:center;gap:10px}
.hdr-logo img{height:32px;filter:drop-shadow(0 0 8px rgba(0,212,255,0.4))}
.hdr-badge{font-size:11px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;padding:4px 12px;border:1px solid rgba(255,255,255,0.08);border-radius:100px}
.hdr-right{display:flex;gap:10px}
.icon-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;color:var(--muted);transition:all .3s;font-size:13px}
.icon-btn:hover{border-color:var(--c1);color:var(--c1);box-shadow:0 0 12px rgba(0,212,255,0.2)}

/* TIMELINE NAV */
.tl-wrap{position:sticky;top:64px;z-index:140;background:rgba(4,8,26,0.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.05);padding:12px 48px;overflow-x:auto;scrollbar-width:none}
.tl-wrap::-webkit-scrollbar{display:none}
.tl{display:flex;align-items:center;gap:0;min-width:max-content}
.tl-group{display:flex;align-items:center;gap:0}
.tl-label{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;padding:0 16px;white-space:nowrap}
.tl-dot{width:28px;height:28px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.15);background:transparent;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);cursor:pointer;transition:all .35s;flex-shrink:0;position:relative}
.tl-dot:hover{border-color:var(--c1);color:var(--c1);transform:scale(1.2)}
.tl-dot.active{border-color:var(--c1);background:var(--c1);color:#04081a;font-weight:700;box-shadow:0 0 16px rgba(0,212,255,0.5);transform:scale(1.15)}
.tl-dot.visited{border-color:rgba(0,212,255,0.35);color:rgba(0,212,255,0.5)}
.tl-line{width:20px;height:1px;background:rgba(255,255,255,0.08);flex-shrink:0}
.tl-line.done{background:rgba(0,212,255,0.3)}
.tl-sep{width:1px;height:20px;background:rgba(255,255,255,0.1);margin:0 8px}

/* HERO */
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 40px 120px;position:relative;z-index:10}
.hero-logo{position:relative;margin-bottom:32px;animation:heroFloat 6s ease-in-out infinite}
.hero-logo img{width:220px;filter:drop-shadow(0 0 40px rgba(0,212,255,0.35)) drop-shadow(0 0 80px rgba(124,58,237,0.25));transition:filter .5s}
.hero-logo img:hover{filter:drop-shadow(0 0 60px rgba(0,212,255,0.6)) drop-shadow(0 0 100px rgba(124,58,237,0.4))}
@keyframes heroFloat{0%,100%{transform:translateY(0) rotate(0deg)}33%{transform:translateY(-12px) rotate(1deg)}66%{transform:translateY(-6px) rotate(-0.5deg)}}
.hero-ring{position:absolute;inset:-30px;border-radius:50%;border:1px solid rgba(0,212,255,0.1);animation:ringPulse 3s ease infinite}
.hero-ring2{position:absolute;inset:-60px;border-radius:50%;border:1px solid rgba(124,58,237,0.08);animation:ringPulse 3s 1s ease infinite}
@keyframes ringPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:0.4}}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(0,212,255,0.07);border:1px solid rgba(0,212,255,0.2);border-radius:100px;padding:7px 20px;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--c1);margin-bottom:28px;animation:fadeUp .8s .2s both}
.hero-title{font-size:clamp(36px,5vw,64px);font-weight:700;line-height:1.1;margin-bottom:16px;animation:fadeUp .8s .35s both}
.hero-title em{font-style:normal;background:linear-gradient(135deg,var(--c1) 0%,var(--c2) 60%,var(--c3) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-sub{font-size:17px;color:var(--muted);max-width:520px;line-height:1.75;margin-bottom:48px;animation:fadeUp .8s .5s both;min-height:28px}
.hero-sub .cursor-blink{display:inline-block;width:2px;height:18px;background:var(--c1);margin-left:2px;animation:blink .7s ease infinite;vertical-align:middle}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.hero-cta{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;animation:fadeUp .8s .65s both}
.btn-prim{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--c1),#0088cc);color:#04081a;font-weight:700;font-size:15px;border:none;border-radius:100px;padding:15px 36px;transition:all .3s;font-family:'Space Grotesk',sans-serif;box-shadow:0 8px 32px rgba(0,212,255,0.3)}
.btn-prim:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 16px 48px rgba(0,212,255,0.5)}
.btn-sec{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,0.05);color:var(--white);font-weight:500;font-size:15px;border:1px solid rgba(255,255,255,0.12);border-radius:100px;padding:15px 36px;transition:all .3s;font-family:'Space Grotesk',sans-serif}
.btn-sec:hover{border-color:var(--c2);background:rgba(124,58,237,0.1);transform:translateY(-2px)}
.hero-stats{display:flex;gap:48px;margin-top:64px;animation:fadeUp .8s .8s both}
.h-stat{text-align:center}
.h-stat-n{font-size:36px;font-weight:700;background:linear-gradient(135deg,var(--c1),var(--c3));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.h-stat-l{font-size:12px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:4px}
.scroll-cue{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;animation:fadeUp .8s 1s both}
.scroll-cue span{font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
.scroll-pill{width:22px;height:38px;border:1.5px solid rgba(255,255,255,0.15);border-radius:20px;display:flex;justify-content:center;align-items:flex-start;padding:5px}
.scroll-pip{width:4px;height:8px;background:var(--c1);border-radius:4px;animation:pip 1.6s ease infinite}
@keyframes pip{0%,100%{transform:translateY(0);opacity:1}60%{transform:translateY(10px);opacity:0.2}}

/* DIVIDER */
.divider{position:relative;z-index:10;display:flex;align-items:center;gap:20px;padding:32px 80px}
.div-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.06),transparent)}
.div-text{font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;white-space:nowrap}

/* STEP SECTION */
.step-wrap{position:relative;z-index:10;min-height:100vh;display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center;padding:80px 80px 80px 100px}
.step-wrap.rev{padding:80px 100px 80px 80px}
.step-wrap.rev .step-info{order:2}
.step-wrap.rev .step-vis{order:1}

.step-info{opacity:0;transform:translateY(40px);transition:opacity .9s ease,transform .9s ease}
.step-info.in{opacity:1;transform:translateY(0)}
.step-vis{opacity:0;transform:translateY(40px) scale(0.96);transition:opacity .9s .18s ease,transform .9s .18s ease}
.step-vis.in{opacity:1;transform:translateY(0) scale(1)}

.step-tag{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.step-num{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:3px;font-weight:700}
.step-cat{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;padding:3px 10px;border:1px solid rgba(255,255,255,0.1);border-radius:100px}
.step-title{font-size:clamp(26px,2.8vw,40px);font-weight:700;line-height:1.2;margin-bottom:18px}
.step-desc{font-size:15px;color:#8fa0c0;line-height:1.85;margin-bottom:28px}
.step-pill{display:inline-flex;align-items:center;gap:12px;border-radius:14px;padding:14px 20px;border:1px solid;font-size:14px}
.step-pill-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.step-pill-label{font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:2px}
.step-pill-text{font-weight:600;font-size:13px}
.code-tag{display:inline-flex;align-items:center;gap:8px;font-family:'Space Mono',monospace;font-size:13px;margin-top:10px;padding:8px 16px;border-radius:8px;background:rgba(124,58,237,0.12);border:1px solid rgba(124,58,237,0.25);color:#c4b5fd;letter-spacing:.5px}

/* SCREEN FRAME / 3D TILT */
.frame-wrap{perspective:1000px;cursor:pointer}
.frame-wrap:hover .frame-glow{opacity:1}
.frame{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:14px;transition:transform .08s ease;transform-style:preserve-3d;position:relative;box-shadow:0 40px 80px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.07)}
.frame::before{content:'';position:absolute;top:-1px;left:15%;right:15%;height:1px;border-radius:1px}
.frame-dots{display:flex;gap:6px;margin-bottom:10px;padding:0 2px}
.frame-dot{width:9px;height:9px;border-radius:50%}
.frame-img{width:100%;border-radius:10px;display:block;transition:transform .4s ease}
.frame-wrap:hover .frame-img{transform:scale(1.01)}
.frame-glow{position:absolute;inset:-2px;border-radius:22px;opacity:0;transition:opacity .4s;pointer-events:none;z-index:-1}
.frame-hint{position:absolute;bottom:20px;right:20px;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);border-radius:8px;padding:6px 12px;font-size:11px;color:var(--muted);letter-spacing:1px;opacity:0;transition:opacity .3s}
.frame-wrap:hover .frame-hint{opacity:1}

/* MODAL */
.modal-bg{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.92);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:center;padding:40px;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-bg.open{opacity:1;pointer-events:all}
.modal-img{max-width:90vw;max-height:85vh;border-radius:16px;box-shadow:0 40px 100px rgba(0,0,0,0.8);transform:scale(0.9);transition:transform .3s ease}
.modal-bg.open .modal-img{transform:scale(1)}
.modal-close{position:absolute;top:24px;right:24px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);color:var(--white);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
.modal-close:hover{background:rgba(255,255,255,0.2);transform:scale(1.1)}

/* FINAL */
.final{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 40px;position:relative;z-index:10}
.final-logo{width:120px;margin-bottom:32px;filter:drop-shadow(0 0 30px rgba(0,212,255,0.3));animation:heroFloat 5s ease infinite}
.final-title{font-size:clamp(32px,4vw,56px);font-weight:700;margin-bottom:16px;line-height:1.2}
.final-desc{font-size:17px;color:var(--muted);max-width:520px;line-height:1.75;margin-bottom:48px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:680px;margin-bottom:48px}
.chip{font-size:12px;color:var(--c1);padding:6px 16px;border-radius:100px;background:rgba(0,212,255,0.07);border:1px solid rgba(0,212,255,0.15);display:flex;align-items:center;gap:6px}
.chip.gold{color:var(--c3);background:rgba(245,166,35,0.07);border-color:rgba(245,166,35,0.2)}

/* SIDE NAV */
.side-nav{position:fixed;right:24px;top:50%;transform:translateY(-50%);z-index:100;display:flex;flex-direction:column;gap:8px}
.s-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.15);border:none;cursor:pointer;transition:all .35s;padding:0}
.s-dot.active{background:var(--c1);box-shadow:0 0 10px var(--c1);transform:scale(1.4)}
.s-dot.visited{background:rgba(0,212,255,0.3)}

@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}

/* AMBIENT ORBS */
.orb{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:1;opacity:.28}
.o1{width:700px;height:700px;background:var(--c2);top:-200px;right:-150px;animation:o1f 22s ease infinite}
.o2{width:500px;height:500px;background:#002244;bottom:-100px;left:-100px;animation:o2f 28s ease infinite}
@keyframes o1f{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,100px)}}
@keyframes o2f{0%,100%{transform:translate(0,0)}50%{transform:translate(80px,-80px)}}

@media(max-width:900px){
  .step-wrap,.step-wrap.rev{grid-template-columns:1fr;gap:40px;padding:60px 28px}
  .step-wrap.rev .step-info{order:1}
  .step-wrap.rev .step-vis{order:2}
  .hero-stats{gap:28px}
  .divider{padding:24px 28px}
  .hdr{padding:14px 24px}
  .tl-wrap{padding:10px 24px}
  .side-nav{display:none}
}
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="orb o1"></div>
<div class="orb o2"></div>
<div id="cd"></div>
<div id="cr"></div>
<div id="section-color"></div>
<div id="prog"></div>
<div id="app"></div>

/* ── CURSOR ── */
function Cursor(){
  const dx=useRef(0),dy=useRef(0),rx=useRef(0),ry=useRef(0),raf=useRef(null);
  useEffect(()=>{
    const cd=document.getElementById("cd"),cr=document.getElementById("cr");
    const move=e=>{dx.current=e.clientX;dy.current=e.clientY};
    const lerp=(a,b,t)=>a+(b-a)*t;
    const tick=()=>{
      rx.current=lerp(rx.current,dx.current,0.12);
      ry.current=lerp(ry.current,dy.current,0.12);
      if(cd){cd.style.left=dx.current+"px";cd.style.top=dy.current+"px";}
      if(cr){cr.style.left=rx.current+"px";cr.style.top=ry.current+"px";}
      raf.current=requestAnimationFrame(tick);
    };
    const over=e=>{if(e.target.closest("button,a,.frame-wrap"))document.body.classList.add("hovering");else document.body.classList.remove("hovering")};
    window.addEventListener("mousemove",move);
    window.addEventListener("mouseover",over);
    raf.current=requestAnimationFrame(tick);
    return()=>{window.removeEventListener("mousemove",move);window.removeEventListener("mouseover",over);cancelAnimationFrame(raf.current)};
  },[]);
  return null;
}

/* ── TYPEWRITER ── */
function useTypewriter(text,speed=38,delay=600){
  const [displayed,setDisplayed]=useState("");
  const [done,setDone]=useState(false);
  useEffect(()=>{
    setDisplayed("");setDone(false);
    let i=0,t;
    const start=setTimeout(()=>{
      t=setInterval(()=>{
        i++;setDisplayed(text.slice(0,i));
        if(i>=text.length){clearInterval(t);setDone(true);}
      },speed);
    },delay);
    return()=>{clearTimeout(start);clearInterval(t)};
  },[text]);
  return[displayed,done];
}

/* ── PARTICLES ── */
function useParticles(){
  useEffect(()=>{
    const c=document.getElementById("bg-canvas");
    if(!c)return;
    const ctx=c.getContext("2d");
    let W=c.width=window.innerWidth,H=c.height=window.innerHeight;
    const pts=Array.from({length:90},()=>({
      x:Math.random()*W,y:Math.random()*H,
      r:Math.random()*1.4+.4,
      vx:(Math.random()-.5)*.18,vy:-Math.random()*.25-.05,
      a:Math.random()*.45+.08,
      col:Math.random()>.55?"#00d4ff":"#7c3aed"
    }));
    let raf;
    const draw=()=>{
      ctx.clearRect(0,0,W,H);
      pts.forEach(p=>{
        p.x+=p.vx;p.y+=p.vy;
        if(p.y<-4)p.y=H+4;
        if(p.x<-4)p.x=W+4;
        if(p.x>W+4)p.x=-4;
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle=p.col+Math.floor(p.a*255).toString(16).padStart(2,"0");
        ctx.fill();
      });
      raf=requestAnimationFrame(draw);
    };
    draw();
    const rs=()=>{W=c.width=window.innerWidth;H=c.height=window.innerHeight};
    window.addEventListener("resize",rs);
    return()=>{cancelAnimationFrame(raf);window.removeEventListener("resize",rs)};
  },[]);
}

/* ── 3D TILT ── */
function TiltFrame({img,title,color,onZoom}){
  const ref=useRef(null);
  const glowRef=useRef(null);
  const onMove=useCallback(e=>{
    const el=ref.current;if(!el)return;
    const r=el.getBoundingClientRect();
    const x=((e.clientX-r.left)/r.width-.5)*18;
    const y=-((e.clientY-r.top)/r.height-.5)*14;
    el.style.transform=`perspective(900px) rotateY(${x}deg) rotateX(${y}deg) scale(1.02)`;
    if(glowRef.current){glowRef.current.style.background=`radial-gradient(ellipse at ${((e.clientX-r.left)/r.width)*100}% ${((e.clientY-r.top)/r.height)*100}%,${color}33,transparent 70%)`;}
  },[color]);
  const onLeave=useCallback(()=>{
    if(ref.current)ref.current.style.transform="perspective(900px) rotateY(0deg) rotateX(0deg) scale(1)";
    if(glowRef.current)glowRef.current.style.background="none";
  },[]);
  const c=color||"#00d4ff";
  return(
    <div className="frame-wrap" onMouseMove={onMove} onMouseLeave={onLeave} onClick={()=>onZoom(img,title)}>
      <div className="frame" ref={ref} style={{"--fc":c}}>
        <div className="frame-glow" ref={glowRef}></div>
        <div style={{position:"absolute",top:-1,left:"15%",right:"15%",height:1,background:`linear-gradient(90deg,transparent,${c}55,transparent)`}}></div>
        <div className="frame-dots">
          <div className="frame-dot" style={{background:"#ff5f57"}}></div>
          <div className="frame-dot" style={{background:"#febc2e"}}></div>
          <div className="frame-dot" style={{background:"#28c840"}}></div>
        </div>
        <img src={img} alt={title} className="frame-img" loading="lazy"/>
        <div className="frame-hint">CLIC PARA AMPLIAR ↗</div>
      </div>
    </div>
  );
}

/* ── STEP SECTION ── */
function StepSection({step,index,onZoom}){
  const infoRef=useRef(null),visRef=useRef(null);
  useEffect(()=>{
    const obs=new IntersectionObserver(([e])=>{
      if(e.isIntersecting){infoRef.current?.classList.add("in");visRef.current?.classList.add("in");}
    },{threshold:0.2});
    const el=document.getElementById(`s${index}`);
    if(el)obs.observe(el);
    return()=>obs.disconnect();
  },[index]);
  const c=step.color||"#00d4ff";
  return(
    <section id={`s${index}`} className={`step-wrap${step.rev?" rev":""}`} data-screen-label={`${step.num} ${step.title}`}>
      <div className="step-info" ref={infoRef}>
        <div className="step-tag">
          <span className="step-num" style={{color:c}}>{step.num}</span>
          <span className="step-cat">{step.cat}</span>
        </div>
        <h2 className="step-title">{step.title}</h2>
        <p className="step-desc">{step.desc}</p>
        <div className="step-pill" style={{borderColor:`${c}33`,background:`${c}0a`}}>
          <div className="step-pill-icon" style={{background:`linear-gradient(135deg,${c},${c}88)`}}>{step.action.icon}</div>
          <div>
            <div className="step-pill-label">{step.action.label}</div>
            <div className="step-pill-text">{step.action.text}</div>
          </div>
        </div>
        {step.code&&<div className="code-tag"><span style={{opacity:.5,fontSize:10}}>›_</span>{step.action.text}</div>}
      </div>
      <div className="step-vis" ref={visRef}>
        <TiltFrame img={step.img} title={step.title} color={c} onZoom={onZoom}/>
      </div>
    </section>
  );
}

/* ── MODAL ── */
function Modal({src,title,onClose}){
  useEffect(()=>{
    const esc=e=>{if(e.key==="Escape")onClose()};
    window.addEventListener("keydown",esc);
    return()=>window.removeEventListener("keydown",esc);
  },[onClose]);
  return(
    <div className={`modal-bg${src?" open":""}`} onClick={e=>{if(e.target.className.includes("modal-bg"))onClose()}}>
      {src&&<img src={src} alt={title} className="modal-img"/>}
      <button className="modal-close" onClick={onClose}>✕</button>
    </div>
  );
}
