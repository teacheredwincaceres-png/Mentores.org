<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --deep:#04081a;
  --navy:#070d2a;
  --cyan:#00d4ff;
  --violet:#7c3aed;
  --gold:#f5a623;
  --gold2:#ffd166;
  --white:#e8f0fe;
  --muted:#6b7fa3;
}
html{scroll-behavior:smooth}
body{
  font-family:'Space Grotesk',sans-serif;
  background:var(--deep);
  color:var(--white);
  overflow-x:hidden;
}

/* CANVAS BG */
#bg-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* NAV DOTS */
.nav-dots{
  position:fixed;right:28px;top:50%;transform:translateY(-50%);
  z-index:100;display:flex;flex-direction:column;gap:10px;
}
.nav-dot{
  width:8px;height:8px;border-radius:50%;
  background:rgba(255,255,255,0.2);
  cursor:pointer;transition:all .3s;border:none;
  position:relative;
}
.nav-dot.active{background:var(--cyan);box-shadow:0 0 12px var(--cyan);width:10px;height:10px}
.nav-dot:hover{background:rgba(0,212,255,0.6)}

/* MENU BTN */
.menu-btn{
  position:fixed;left:28px;top:50%;transform:translateY(-50%);
  z-index:100;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  backdrop-filter:blur(12px);
  border-radius:50px;
  padding:12px 20px;
  color:var(--white);
  font-family:'Space Grotesk',sans-serif;
  font-size:13px;font-weight:500;
  cursor:pointer;
  display:flex;align-items:center;gap:8px;
  writing-mode:vertical-rl;
  text-orientation:mixed;
  letter-spacing:2px;
  transition:all .3s;
}
.menu-btn:hover{background:rgba(0,212,255,0.1);border-color:rgba(0,212,255,0.4);box-shadow:0 0 20px rgba(0,212,255,0.15)}

/* SOCIAL */
.social-bar{
  position:fixed;top:28px;right:60px;
  z-index:100;display:flex;gap:12px;align-items:center;
}
.social-link{
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:14px;
  cursor:pointer;transition:all .3s;text-decoration:none;
}
.social-link:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 12px rgba(0,212,255,0.2)}

/* STEP COUNTER */
.step-counter{
  position:fixed;left:28px;bottom:40px;
  z-index:100;
  font-family:'Space Mono',monospace;
  font-size:12px;color:var(--muted);
  letter-spacing:1px;
}
.step-counter span{color:var(--cyan)}

/* SECTIONS */
.section{
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:80px 120px 80px 120px;
  position:relative;z-index:10;
}

/* HERO */
.hero{
  flex-direction:column;
  text-align:center;
  min-height:100vh;
  padding:0 40px;
}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(0,212,255,0.08);
  border:1px solid rgba(0,212,255,0.2);
  border-radius:100px;
  padding:8px 20px;
  font-size:12px;letter-spacing:3px;text-transform:uppercase;
  color:var(--cyan);margin-bottom:32px;
  animation:fadeUp .8s ease both;
}
.logo-area{
  margin-bottom:32px;
  animation:fadeUp .8s .1s ease both;
}
.logo-stars{
  font-size:48px;margin-bottom:8px;
  display:block;
  animation:pulse 3s ease infinite;
}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 8px var(--gold))}50%{filter:drop-shadow(0 0 24px var(--gold)) drop-shadow(0 0 48px rgba(245,166,35,0.4))}}
.logo-title{
  font-size:clamp(48px,6vw,80px);font-weight:700;
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold2) 50%,var(--gold) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:-1px;line-height:1;
  text-shadow:none;
}
.logo-sub{
  font-size:15px;color:var(--muted);letter-spacing:4px;margin-top:8px;
}
.hero-headline{
  font-size:clamp(32px,4vw,52px);font-weight:700;
  line-height:1.15;
  animation:fadeUp .8s .2s ease both;
  max-width:800px;
  margin:0 auto 20px;
}
.hero-headline em{
  font-style:normal;
  background:linear-gradient(90deg,var(--cyan),var(--violet));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.hero-desc{
  font-size:18px;color:var(--muted);max-width:560px;margin:0 auto 48px;
  line-height:1.7;
  animation:fadeUp .8s .3s ease both;
}
.hero-cta{
  animation:fadeUp .8s .4s ease both;
}
.btn-primary{
  display:inline-flex;align-items:center;gap:10px;
  background:linear-gradient(135deg,var(--cyan),#0088cc);
  color:#04081a;font-weight:700;font-size:16px;
  border:none;border-radius:100px;
  padding:16px 40px;cursor:pointer;
  transition:all .3s;font-family:'Space Grotesk',sans-serif;
  box-shadow:0 8px 32px rgba(0,212,255,0.3);
}
.btn-primary:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 12px 48px rgba(0,212,255,0.5)}
.scroll-hint{
  position:absolute;bottom:40px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:8px;
  color:var(--muted);font-size:12px;letter-spacing:2px;
  animation:fadeUp .8s .6s ease both;
}
.scroll-arrow{
  width:24px;height:40px;border:2px solid rgba(255,255,255,0.15);
  border-radius:20px;display:flex;justify-content:center;padding-top:6px;
}
.scroll-dot{
  width:4px;height:8px;background:var(--cyan);border-radius:4px;
  animation:scrollBounce 1.5s ease infinite;
}
@keyframes scrollBounce{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(10px);opacity:0.3}}

/* STEP SECTION */
.step-section{
  min-height:100vh;
  display:grid;grid-template-columns:1fr 1fr;
  gap:80px;align-items:center;
  padding:80px 120px;
  position:relative;z-index:10;
}
.step-section.reverse{direction:rtl}
.step-section.reverse > *{direction:ltr}

.step-info{opacity:0;transform:translateX(-40px);transition:all .8s ease}
.step-section.reverse .step-info{transform:translateX(40px)}
.step-info.visible{opacity:1;transform:translateX(0)}
.step-visual{opacity:0;transform:translateX(40px);transition:all .8s .15s ease}
.step-section.reverse .step-visual{transform:translateX(-40px)}
.step-visual.visible{opacity:1;transform:translateX(0)}

.step-number{
  font-family:'Space Mono',monospace;
  font-size:13px;letter-spacing:3px;color:var(--cyan);
  margin-bottom:16px;display:flex;align-items:center;gap:12px;
}
.step-number::after{content:'';flex:1;max-width:60px;height:1px;background:linear-gradient(90deg,var(--cyan),transparent)}
.step-title{
  font-size:clamp(28px,3vw,42px);font-weight:700;
  line-height:1.2;margin-bottom:20px;
}
.step-desc{
  font-size:16px;color:#8fa0c0;line-height:1.8;margin-bottom:32px;
}
.step-action{
  display:inline-flex;align-items:center;gap:12px;
  background:rgba(0,212,255,0.06);
  border:1px solid rgba(0,212,255,0.2);
  border-radius:16px;padding:16px 24px;
  font-size:15px;
}
.step-action-icon{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,var(--cyan),var(--violet));
  display:flex;align-items:center;justify-content:center;font-size:16px;
}
.step-action-label{font-size:12px;color:var(--muted);margin-bottom:2px;letter-spacing:1px}
.step-action-text{font-weight:600;color:var(--white);font-size:14px}

.code-pill{
  display:inline-flex;align-items:center;gap:10px;
  background:rgba(124,58,237,0.15);
  border:1px solid rgba(124,58,237,0.3);
  border-radius:10px;padding:10px 18px;
  font-family:'Space Mono',monospace;font-size:14px;
  color:var(--gold2);margin-top:12px;
}

/* SCREENSHOT FRAME */
.screen-frame{
  background:linear-gradient(135deg,rgba(255,255,255,0.06),rgba(255,255,255,0.02));
  border:1px solid rgba(255,255,255,0.1);
  border-radius:24px;
  padding:16px;
  position:relative;
  box-shadow:0 40px 80px rgba(0,0,0,0.6),0 0 0 1px rgba(255,255,255,0.05),inset 0 1px 0 rgba(255,255,255,0.08);
}
.screen-frame::before{
  content:'';position:absolute;top:-1px;left:20%;right:20%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,212,255,0.4),transparent);
}
.screen-dots{display:flex;gap:6px;margin-bottom:12px;padding:0 4px}
.screen-dot{width:10px;height:10px;border-radius:50%}
.screen-img{
  width:100%;border-radius:14px;
  display:block;
  box-shadow:0 8px 32px rgba(0,0,0,0.4);
}

/* FINAL SECTION */
.final-section{
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;padding:80px 40px;
  position:relative;z-index:10;
}
.final-badge{
  font-size:64px;margin-bottom:24px;
  animation:celebratePulse 2s ease infinite;
}
@keyframes celebratePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.final-title{font-size:clamp(36px,5vw,60px);font-weight:700;margin-bottom:20px;line-height:1.2}
.final-desc{font-size:18px;color:var(--muted);max-width:560px;line-height:1.7;margin-bottom:48px}
.steps-complete{
  display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:600px;margin-bottom:48px;
}
.step-chip{
  background:rgba(0,212,255,0.08);
  border:1px solid rgba(0,212,255,0.15);
  border-radius:100px;padding:8px 18px;
  font-size:13px;color:var(--cyan);
  display:flex;align-items:center;gap:6px;
}

/* DIVIDER */
.section-divider{
  position:relative;z-index:10;
  display:flex;align-items:center;justify-content:center;
  padding:40px 120px;
  gap:24px;
}
.divider-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.06),transparent)}
.divider-icon{font-size:20px;opacity:0.4}

@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

/* GLOW ORBS */
.orb{
  position:fixed;border-radius:50%;filter:blur(100px);
  pointer-events:none;z-index:1;opacity:0.35;
}
.orb-1{width:600px;height:600px;background:var(--violet);top:-200px;right:-100px;animation:orbFloat1 20s ease infinite}
.orb-2{width:500px;height:500px;background:#003366;bottom:-150px;left:-100px;animation:orbFloat2 25s ease infinite}
.orb-3{width:300px;height:300px;background:rgba(0,212,255,0.3);top:50%;left:50%;animation:orbFloat3 15s ease infinite}
@keyframes orbFloat1{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,80px)}}
@keyframes orbFloat2{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,-60px)}}
@keyframes orbFloat3{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.3)}}

/* PARTICLES */
.particle{position:fixed;border-radius:50%;pointer-events:none;z-index:1}

/* PROGRESS LINE */
.progress-line{
  position:fixed;left:0;top:0;width:3px;height:0%;
  background:linear-gradient(180deg,var(--cyan),var(--violet));
  z-index:200;transition:height .1s linear;
  box-shadow:0 0 8px var(--cyan);
}

/* HEADER */
.top-header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:20px 60px;
  display:flex;align-items:center;justify-content:space-between;
}
.header-logo{
  font-size:16px;font-weight:700;color:var(--gold);
  letter-spacing:1px;display:flex;align-items:center;gap:8px;
}
.header-logo span{color:var(--muted);font-weight:400;font-size:13px}

/* RESPONSIVE */
@media(max-width:900px){
  .step-section{grid-template-columns:1fr;gap:40px;padding:60px 32px}
  .step-section.reverse{direction:ltr}
  .section{padding:60px 32px}
  .top-header{padding:16px 32px}
  .menu-btn{display:none}
}
</style>
</head>

const sectionIds = ["hero", ...steps.map((_, i) => `step-${i}`), "final"];

function StepSection({ step, index, activeSection }) {
  const ref = useRef(null);
  const infoRef = useRef(null);
  const visRef = useRef(null);
  const id = `step-${index}`;

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) {
        infoRef.current?.classList.add("visible");
        visRef.current?.classList.add("visible");
      }
    }, { threshold: 0.2 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);

  const colorMap = { "#00d4ff": "cyan", "#7c3aed": "violet", "#f5a623": "gold", "#4285f4": "blue" };

  return (
    <section id={id} ref={ref} className={`step-section${step.reverse ? " reverse" : ""}`} data-screen-label={step.number}>
      <div className="step-info" ref={infoRef}>
        <div className="step-number" style={{ color: step.color }}>{step.number}</div>
        <h2 className="step-title">{step.title}</h2>
        <p className="step-desc">{step.desc}</p>
        <div className="step-action" style={{ borderColor: `${step.color}33`, background: `${step.color}0a` }}>
          <div className="step-action-icon" style={{ background: `linear-gradient(135deg,${step.color},${step.color}88)` }}>
            {step.action.icon}
          </div>
          <div>
            <div className="step-action-label">{step.action.label}</div>
            <div className="step-action-text">{step.action.text}</div>
          </div>
        </div>
        {step.code && (
          <div className="code-pill" style={{ borderColor: `${step.color}44`, color: step.color }}>
            <span style={{ opacity: 0.6, fontSize: 11 }}>›</span>
            {step.action.text}
          </div>
        )}
      </div>
      <div className="step-visual" ref={visRef}>
        <div className="screen-frame">
          <div className="screen-dots">
            <div className="screen-dot" style={{ background: "#ff5f57" }}></div>
            <div className="screen-dot" style={{ background: "#febc2e" }}></div>
            <div className="screen-dot" style={{ background: "#28c840" }}></div>
          </div>
          <img src={step.img} alt={step.title} className="screen-img" loading="lazy" />
        </div>
      </div>
    </section>
  );
}

function App() {
  const [activeSection, setActiveSection] = useState(0);

  useEffect(() => {
    // Progress bar
    const handleScroll = () => {
      const scrollTop = window.scrollY;
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const pct = (scrollTop / docHeight) * 100;
      document.getElementById("progress-line").style.height = pct + "%";

      // Detect active section
      const sections = sectionIds.map(id => document.getElementById(id));
      let active = 0;
      sections.forEach((el, i) => {
        if (el && el.getBoundingClientRect().top < window.innerHeight * 0.5) active = i;
      });
      setActiveSection(active);
      const counter = document.getElementById("step-counter");
      if (counter) {
        const num = String(active + 1).padStart(2, "0");
        counter.innerHTML = `<span>${num}</span> / ${sectionIds.length}`;
      }
    };
    window.addEventListener("scroll", handleScroll, { passive: true });
    return () => window.removeEventListener("scroll", handleScroll);
  }, []);

  useEffect(() => {
    // Nav dots
    const container = document.getElementById("nav-dots");
    if (!container) return;
    container.innerHTML = "";
    sectionIds.forEach((id, i) => {
      const btn = document.createElement("button");
      btn.className = `nav-dot${i === activeSection ? " active" : ""}`;
      btn.title = i === 0 ? "Inicio" : i === sectionIds.length - 1 ? "Final" : `Paso ${i}`;
      btn.onclick = () => {
        document.getElementById(id)?.scrollIntoView({ behavior: "smooth" });
      };
      container.appendChild(btn);
    });
  }, [activeSection]);

  useEffect(() => {
    const btn = document.getElementById("menu-btn");
    if (btn) {
      btn.onclick = () => {
        document.getElementById("step-0")?.scrollIntoView({ behavior: "smooth" });
      };
    }
    // Particles canvas
    const canvas = document.getElementById("bg-canvas");
    const ctx = canvas.getContext("2d");
    let W = canvas.width = window.innerWidth;
    let H = canvas.height = window.innerHeight;
    const particles = Array.from({ length: 80 }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.5 + 0.5,
      vx: (Math.random() - 0.5) * 0.2,
      vy: -Math.random() * 0.3 - 0.05,
      alpha: Math.random() * 0.5 + 0.1,
      color: Math.random() > 0.5 ? "#00d4ff" : "#7c3aed",
    }));
    let raf;
    const animate = () => {
      ctx.clearRect(0, 0, W, H);
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if (p.y < -5) p.y = H + 5;
        if (p.x < -5) p.x = W + 5;
        if (p.x > W + 5) p.x = -5;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color + Math.floor(p.alpha * 255).toString(16).padStart(2,"0");
        ctx.fill();
      });
      raf = requestAnimationFrame(animate);
    };
    animate();
    const handleResize = () => { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; };
    window.addEventListener("resize", handleResize);
    return () => { cancelAnimationFrame(raf); window.removeEventListener("resize", handleResize); };
  }, []);

  return (
    <>
      {/* HERO */}
      <section id="hero" className="section hero" data-screen-label="00 Hero">
        <div className="hero-badge">✦ GUATESTAR · PROGRAMA MENTORES</div>
        <div className="logo-area">
          <span className="logo-stars">✦</span>
          <div className="logo-title">MentorIA SOL</div>
          <div className="logo-sub">SISTEMA DE APRENDIZAJE — AURA LOGISTICS & TECH</div>
        </div>
        <h1 className="hero-headline">Guía de acceso a tu<br/><em>plataforma de mentoría</em></h1>
        <p className="hero-desc">Sigue estos 10 pasos sencillos para ingresar a MentorIA SOL y comenzar tu camino de desarrollo y liderazgo.</p>
        <div className="hero-cta">
          <button className="btn-primary" onClick={() => document.getElementById("step-0")?.scrollIntoView({ behavior: "smooth" })}>
            <span>Empieza tu camino</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </div>
        <div className="scroll-hint">
          <span>DESPLÁZATE</span>
          <div className="scroll-arrow"><div className="scroll-dot"></div></div>
        </div>
      </section>

      {/* STEPS */}
      {steps.map((step, i) => (
        <React.Fragment key={i}>
          {i === 0 && (
            <div className="section-divider">
              <div className="divider-line"></div>
              <div className="divider-icon">✦</div>
              <div style={{ fontSize: 13, letterSpacing: 3, color: "var(--muted)", textTransform: "uppercase" }}>10 Pasos de acceso · 11 Secciones del sistema</div>
              <div className="divider-icon">✦</div>
              <div className="divider-line"></div>
            </div>
          )}
          <StepSection step={step} index={i} activeSection={activeSection} />
        </React.Fragment>
      ))}

      {/* FINAL */}
      <section id="final" className="final-section" data-screen-label="11 Final">
        <div className="final-badge">🌟</div>
        <h2 className="final-title">¡Ya conoces toda la <span style={{ background: "linear-gradient(90deg,var(--cyan),var(--violet))", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>plataforma!</span></h2>
        <p className="final-desc">Has revisado los 10 pasos de acceso y las 11 secciones de MentorIA SOL. Tu camino de crecimiento, liderazgo y propósito empieza ahora con GuateStar.</p>
        <div className="steps-complete">
          {steps.map((s, i) => (
            <div key={i} className="step-chip">
              <span>✓</span> {s.number}
            </div>
          ))}
        </div>
        <button className="btn-primary" onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })}>
          <span>Ver guía de nuevo</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M5 12h14M12 5l7 7-7 7" transform="rotate(180 12 12)"/></svg>
        </button>
        <p style={{ marginTop: 40, color: "var(--muted)", fontSize: 13, letterSpacing: 2 }}>© 2026 GuateStar · MentorIA SOL v2.0</p>
      </section>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App />);
</script>
